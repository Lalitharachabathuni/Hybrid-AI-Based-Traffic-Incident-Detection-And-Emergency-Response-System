<head>
  <meta charset="UTF-8" />

  <title>Hybrid AI Traffic Incident Detection & Emergency Response System | NH16 India</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Chart.js -->

  <!-- React 18 & ReactDOM -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body {
      background-color: #080c16;
      color: #e2e8f0;
    }
    .glass-panel {
      background: rgba(19, 27, 46, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-panel-elevated {
      background: rgba(26, 35, 58, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .radar-pulse {
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8);
      }
      70% {
        box-shadow: 0 0 0 14px rgba(239, 68, 68, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1322;
    }
    ::-webkit-scrollbar-thumb {
      background: #273553;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #384b72;
    }
    .leaflet-popup-content-wrapper {
      background: #131b2e !important;
      color: #e2e8f0 !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 12px !important;
    }
    .leaflet-popup-tip {
      background: #131b2e !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    const getInitialApiBase = () => {
      const saved = localStorage.getItem("nh16_api_base");
      if (saved) return saved;
      if (window.location.origin && window.location.origin.startsWith("http")) {
        return window.location.origin;
      }
      return "http://127.0.0.1:8000";
    };

    let API_BASE = getInitialApiBase();

    // Multi-language dictionary
    const I18N = {
      en: {
        system_title: "Hybrid AI Traffic Incident & Emergency Response",
        corridor: "NH16 Highway Corridor (Vijayawada — Kavali, AP)",
        nav_citizen: "Citizen Incident Portal",
        nav_control_room: "Admin Control Room",
        nav_analytics: "Corridor Analytics",
        nav_sandbox: "AI Prediction Sandbox",
        login_btn: "Admin Login",
        logout_btn: "Logout",
        emergency_strip: "Emergency Services Available 24/7:",
        call_112: "National 112",
        call_108: "Ambulance 108",
        call_100: "Police 100",
        call_101: "Fire 101",
        call_1033: "NHAI 1033",
        report_accident_title: "Report a Road Accident",
        report_accident_sub: "Upload accident photo with GPS location to automatically alert emergency services.",
        detect_loc: "Detect My Current GPS Location",
        submit_report: "Submit Emergency Incident Report",
        track_report: "Track Incident Report Status",
        enter_ref: "Enter Reference No (e.g. CR-1)",
        track_btn: "Track Status",
      },
      te: {
        system_title: "హైబ్రిడ్ AI ట్రాఫిక్ ప్రమాద గుర్తింపు & అత్యవసర స్పందన వ్యవస్థ",
        corridor: "NH16 హైవే కారిడార్ (విజయవాడ — కావలి, ఆంధ్రప్రదేశ్)",
        nav_citizen: "పౌర ప్రమాద నివేదిక పోర్టల్",
        nav_control_room: "కంట్రోల్ రూమ్ డ్యాష్‌బోర్డ్",
        nav_analytics: "ట్రాఫిక్ అనలిటిక్స్",
        nav_sandbox: "AI ప్రెడిక్షన్ టెస్టింగ్",
        login_btn: "అడ్మిన్ లాగిన్",
        logout_btn: "లాగౌట్",
        emergency_strip: "24/7 అత్యవసర సహాయం అందుబాటులో ఉంది:",
        call_112: "జాతీయ 112",
        call_108: "అంబులెన్స్ 108",
        call_100: "పోలీస్ 100",
        call_101: "ఫైర్ 101",
        call_1033: "NHAI 1033",
        report_accident_title: "రోడ్డు ప్రమాదాన్ని నివేదించండి",
        report_accident_sub: "ఫోటో మరియు GPS లొకేషన్ తో వెంటనే అత్యవసర బృందాలకు సమాచారం అందించండి.",
        detect_loc: "నా ప్రస్తుత GPS లొకేషన్ గుర్తించండి",
        submit_report: "అత్యవసర నివేదికను పంపండి",
        track_report: "నివేదిక స్థితిని తనిఖీ చేయండి",
        enter_ref: "రిఫరెన్స్ నంబర్ నమోదు చేయండి (ఉదా: CR-1)",
        track_btn: "స్థితిని చూడండి",
      },
      hi: {
        system_title: "हाइब्रिड AI सड़क दुर्घटना पहचान और आपातकालीन प्रतिक्रिया प्रणाली",
        corridor: "NH16 हाईवे कॉरिडोर (विजयवाड़ा — कावली, आंध्र प्रदेश)",
        nav_citizen: "नागरिक दुर्घटना पोर्टल",
        nav_control_room: "कंट्रोल रूम डैशबोर्ड",
        nav_analytics: "दुर्घटना विश्लेषण",
        nav_sandbox: "AI भविष्यवाणी परीक्षण",
        login_btn: "एडमिन लॉगिन",
        logout_btn: "लॉगआउट",
        emergency_strip: "24/7 आपातकालीन सहायता सेवाएं:",
        call_112: "राष्ट्रीय 112",
        call_108: "एम्बुलेंस 108",
        call_100: "पुलिस 100",
        call_101: "अग्निशामक 101",
        call_1033: "NHAI 1033",
        report_accident_title: "सड़क दुर्घटना की सूचना दें",
        report_accident_sub: "फोटो और GPS लोकेशन के साथ तुरंत आपातकालीन सेवाओं को सूचित करें।",
        detect_loc: "वर्तमान GPS लोकेशन प्राप्त करें",
        submit_report: "आपातकालीन रिपोर्ट दर्ज करें",
        track_report: "रिपोर्ट की स्थिति ट्रैक करें",
        enter_ref: "रेफरेंस नंबर दर्ज करें (उदा: CR-1)",
        track_btn: "स्थिति देखें",
      }
    };

    const SEVERITY_CONFIG = {
      Normal:   { bg: "bg-emerald-500/10", border: "border-emerald-500/30", text: "text-emerald-400", dot: "bg-emerald-500", badge: "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30" },
      Minor:    { bg: "bg-amber-500/10",   border: "border-amber-500/30",   text: "text-amber-400",   dot: "bg-amber-500",   badge: "bg-amber-500/20 text-amber-300 border border-amber-500/30" },
      Moderate: { bg: "bg-orange-500/10",  border: "border-orange-500/30",  text: "text-orange-400",  dot: "bg-orange-500",  badge: "bg-orange-500/20 text-orange-300 border border-orange-500/30" },
      Major:    { bg: "bg-rose-500/10",    border: "border-rose-500/30",    text: "text-rose-400",    dot: "bg-rose-500",    badge: "bg-rose-500/20 text-rose-300 border border-rose-500/30" },
    };

    function Badge({ label }) {
      const cfg = SEVERITY_CONFIG[label] || { badge: "bg-slate-700 text-slate-300 border border-slate-600" };
      return <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide ${cfg.badge}`}>{label || "Unknown"}</span>;
    }

    function StatusBadge({ status }) {
      const styles = {
        'Reported': 'bg-blue-500/20 text-blue-300 border-blue-500/30',
        'Dispatched': 'bg-amber-500/20 text-amber-300 border-amber-500/30',
        'On Scene': 'bg-purple-500/20 text-purple-300 border-purple-500/30',
        'Resolved': 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
        'Active': 'bg-rose-500/20 text-rose-300 border-rose-500/30',
        'Cleared': 'bg-slate-700 text-slate-300 border-slate-600',
      };
      const cls = styles[status] || 'bg-slate-700 text-slate-300 border-slate-600';
      return <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold border ${cls}`}>{status}</span>;
    }

    function App() {
      const [lang, setLang] = useState('en');
      const [activeTab, setActiveTab] = useState('citizen'); // 'citizen' | 'control_room' | 'analytics' | 'sandbox'
      const [currentTime, setCurrentTime] = useState(new Date());

      // Auth State
      const [adminToken, setAdminToken] = useState(() => localStorage.getItem("nh16_admin_token") || "");
      const [adminUser, setAdminUser] = useState(() => localStorage.getItem("nh16_admin_user") || "");
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginUsername, setLoginUsername] = useState("admin");
      const [loginPassword, setLoginPassword] = useState("");
      const [loginError, setLoginError] = useState("");
      const [loginLoading, setLoginLoading] = useState(false);

      // Data States
      const [stats, setStats] = useState({ total_incidents: 0, by_severity: {} });
      const [incidents, setIncidents] = useState([]);
      const [citizenReports, setCitizenReports] = useState([]);
      const [stations, setStations] = useState([]);
      const [analyticsData, setAnalyticsData] = useState(null);
      const [simStatus, setSimStatus] = useState({ running: false, processed: 0, incidents_found: 0 });
      const [backendUp, setBackendUp] = useState(true);

      // Modals / Details
      const [selectedIncident, setSelectedIncident] = useState(null);
      const [selectedCitizenReport, setSelectedCitizenReport] = useState(null);

      // Citizen Form State
      const [citizenFile, setCitizenFile] = useState(null);
      const [citizenPreview, setCitizenPreview] = useState(null);
      const [citizenLat, setCitizenLat] = useState(null);
      const [citizenLon, setCitizenLon] = useState(null);
      const [citizenLocationText, setCitizenLocationText] = useState("");
      const [citizenSeverity, setCitizenSeverity] = useState("Not sure");
      const [citizenDesc, setCitizenDesc] = useState("");
      const [citizenName, setCitizenName] = useState("");
      const [citizenPhone, setCitizenPhone] = useState("");
      const [citizenSubmitting, setCitizenSubmitting] = useState(false);
      const [citizenSuccess, setCitizenSuccess] = useState(null);

      // Tracking State
      const [trackRefNo, setTrackRefNo] = useState("");
      const [trackedReport, setTrackedReport] = useState(null);
      const [trackLoading, setTrackLoading] = useState(false);
      const [trackError, setTrackError] = useState("");

      // Simulation Controls State
      const [simSpeed, setSimSpeed] = useState(800);
      const [simLimit, setSimLimit] = useState(3000);

      // AI Sandbox Predictor State
      const [sbSpeed, setSbSpeed] = useState(35.0);
      const [sbOccupancy, setSbOccupancy] = useState(0.28);
      const [sbFlow, setSbFlow] = useState(1400);
      const [sbHour, setSbHour] = useState(14);
      const [sbStation, setSbStation] = useState("Guntur");
      const [sbDirection, setSbDirection] = useState("NB");
      const [sbPrediction, setSbPrediction] = useState(null);
      const [sbLoading, setSbLoading] = useState(false);

      // Notification Toasts
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Clock ticker
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Verify Auth Token on mount
      useEffect(() => {
        if (adminToken) {
          fetch(`${API_BASE}/api/auth/me`, {
            headers: { Authorization: `Bearer ${adminToken}` }
          })
          .then(res => {
            if (!res.ok) {
              // expired or invalid
              setAdminToken("");
              setAdminUser("");
              localStorage.removeItem("nh16_admin_token");
              localStorage.removeItem("nh16_admin_user");
            }
          })
          .catch(() => {});
        }
      }, [adminToken]);

      // Fetch All System Data
      const fetchData = useCallback(async () => {
        try {
          const [st, inc, cRep, sim, stns, an] = await Promise.all([
            fetch(`${API_BASE}/api/stats`).then(r => r.json()),
            fetch(`${API_BASE}/api/incidents?limit=200`).then(r => r.json()),
            fetch(`${API_BASE}/api/citizen/reports?limit=200`).then(r => r.json()),
            fetch(`${API_BASE}/api/simulation/status`).then(r => r.json()),
            fetch(`${API_BASE}/api/stations`).then(r => r.json()),
            fetch(`${API_BASE}/api/analytics`).then(r => r.json()),
          ]);
          setStats(st);
          setIncidents(inc);
          setCitizenReports(cRep);
          setSimStatus(sim);
          setStations(stns);
          setAnalyticsData(an);
          setBackendUp(true);
        } catch (err) {
          setBackendUp(false);
        }
      }, []);

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 4000);
        return () => clearInterval(interval);
      }, [fetchData]);

      // Handle Admin Login
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError("");
        setLoginLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: loginUsername, password: loginPassword })
          });
          const data = await res.json();
          if (!res.ok) {
            setLoginError(data.detail || "Invalid credentials");
          } else {
            setAdminToken(data.token);
            setAdminUser(data.username);
            localStorage.setItem("nh16_admin_token", data.token);
            localStorage.setItem("nh16_admin_user", data.username);
            setShowLoginModal(false);
            setLoginPassword("");
            showToast(`Welcome back, ${data.username}! Admin access granted.`, "success");
            if (activeTab !== 'control_room') setActiveTab('control_room');
          }
        } catch (err) {
          setLoginError("Could not connect to authentication server.");
        } finally {
          setLoginLoading(false);
        }
      };

      const handleLogout = async () => {
        if (adminToken) {
          fetch(`${API_BASE}/api/auth/logout`, {
            method: "POST",
            headers: { Authorization: `Bearer ${adminToken}` }
          }).catch(() => {});
        }
        setAdminToken("");
        setAdminUser("");
        localStorage.removeItem("nh16_admin_token");
        localStorage.removeItem("nh16_admin_user");
        showToast("Logged out of Admin Control Room.", "info");
      };

      // Citizen Geolocation
      const handleDetectLocation = () => {
        if (!navigator.geolocation) {
          alert("Geolocation is not supported by your browser.");
          return;
        }
        setCitizenLocationText("Detecting coordinates from device GPS...");
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            setCitizenLat(lat);
            setCitizenLon(lon);
            try {
              const res = await fetch(`${API_BASE}/api/geocode?lat=${lat}&lon=${lon}`).then(r => r.json());
              if (res && res.display_address) {
                setCitizenLocationText(res.display_address);
              } else {
                setCitizenLocationText(`GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)} (NH16 Highway Corridor)`);
              }
            } catch {
              setCitizenLocationText(`GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`);
            }
          },
          (err) => {
            // Default fallback coordinates around NH16 Vijayawada-Guntur stretch if browser blocks GPS
            const fallbackLat = 16.3067;
            const fallbackLon = 80.4365;
            setCitizenLat(fallbackLat);
            setCitizenLon(fallbackLon);
            setCitizenLocationText("Guntur Corridor, NH16, Andhra Pradesh (Location Permission Required)");
          }
        );
      };

      // Citizen Photo Handle
      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setCitizenFile(file);
          setCitizenPreview(URL.createObjectURL(file));
        }
      };

      // Citizen Submit Report
      const handleCitizenSubmit = async (e) => {
        e.preventDefault();
        if (!citizenFile) {
          alert("Please capture or select an accident photo.");
          return;
        }
        setCitizenSubmitting(true);
        const formData = new FormData();
        formData.append("image", citizenFile);
        if (citizenLat) formData.append("lat", citizenLat);
        if (citizenLon) formData.append("lon", citizenLon);
        formData.append("description", citizenDesc || "Roadside traffic accident reported by citizen.");
        formData.append("severity_label", citizenSeverity);
        formData.append("reporter_name", citizenName || "Citizen (NH16)");
        formData.append("reporter_phone", citizenPhone || "Confidential");

        try {
          const res = await fetch(`${API_BASE}/api/citizen/report`, {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          if (res.ok) {
            setCitizenSuccess(data);
            setCitizenFile(null);
            setCitizenPreview(null);
            setCitizenDesc("");
            setCitizenPhone("");
            setCitizenName("");
            fetchData();
            showToast(`Incident Reported Successfully! Ref: ${data.reference_no}`, "success");
          } else {
            alert(data.detail || "Submission failed. Please try again.");
          }
        } catch (err) {
          alert("Could not connect to emergency dispatch server.");
        } finally {
          setCitizenSubmitting(false);
        }
      };

      // Citizen Track Report
      const handleTrackReport = async (e) => {
        e.preventDefault();
        if (!trackRefNo.trim()) return;
        setTrackLoading(true);
        setTrackError("");
        setTrackedReport(null);
        try {
          const res = await fetch(`${API_BASE}/api/citizen/track/${encodeURIComponent(trackRefNo.trim())}`);
          const data = await res.json();
          if (res.ok) {
            setTrackedReport(data);
          } else {
            setTrackError(data.detail || "No report found with this reference number.");
          }
        } catch {
          setTrackError("Error checking tracking status.");
        } finally {
          setTrackLoading(false);
        }
      };

      // Admin Status Updates
      const handleUpdateCitizenStatus = async (reportId, newStatus) => {
        try {
          const res = await fetch(`${API_BASE}/api/citizen/reports/${reportId}/status`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${adminToken}`
            },
            body: JSON.stringify({ status: newStatus })
          });
          if (res.ok) {
            showToast(`Report CR-${reportId} status updated to ${newStatus}`, "success");
            fetchData();
            if (selectedCitizenReport && selectedCitizenReport.id === reportId) {
              setSelectedCitizenReport(prev => ({ ...prev, status: newStatus }));
            }
          }
        } catch {
          showToast("Failed to update status", "error");
        }
      };

      const handleUpdateIncidentStatus = async (incidentId, newStatus) => {
        try {
          const res = await fetch(`${API_BASE}/api/incidents/${incidentId}/status`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${adminToken}`
            },
            body: JSON.stringify({ status: newStatus })
          });
          if (res.ok) {
            showToast(`Incident #${incidentId} status updated to ${newStatus}`, "success");
            fetchData();
            if (selectedIncident && selectedIncident.id === incidentId) {
              setSelectedIncident(prev => ({ ...prev, status: newStatus }));
            }
          }
        } catch {

                    <select
                      value={selectedCitizenReport.status}
                      onChange={(e) => handleUpdateCitizenStatus(selectedCitizenReport.id, e.target.value)}
                      className="bg-dark-950 border border-slate-700 rounded-lg px-2.5 py-1 text-slate-200 text-xs"
                    >
                      <option value="Reported">Reported</option>
                      <option value="Dispatched">Dispatched (Units Mobilized)</option>
                      <option value="On Scene">On Scene (First Responders Arrived)</option>
                      <option value="Resolved">Resolved (Cleared & Hospitalized)</option>
                    </select>
                  </div>
                )}

                {selectedCitizenReport.image_path && (
                  <div className="rounded-xl overflow-hidden border border-white/10">
                    <img src={`${API_BASE}${selectedCitizenReport.image_path}`} alt="Accident Scene" className="w-full max-h-72 object-contain bg-black" />
                  </div>
                )}

                <div className="bg-dark-950 p-3 rounded-xl border border-white/10 text-xs space-y-1">
                  <div><strong>Location:</strong> {selectedCitizenReport.display_address || "NH16 Highway"}</div>
                  {selectedCitizenReport.lat && <div><strong>GPS:</strong> {selectedCitizenReport.lat.toFixed(5)}, {selectedCitizenReport.lon.toFixed(5)}</div>}
                  {selectedCitizenReport.reporter_name && <div><strong>Reporter:</strong> {selectedCitizenReport.reporter_name} ({selectedCitizenReport.reporter_phone || "No phone"})</div>}
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-semibold text-slate-300">AI Generated Dispatch Report:</span>
                  <pre className="bg-dark-950 p-3 rounded-xl border border-white/10 text-xs font-mono text-slate-300 whitespace-pre-wrap">
                    {selectedCitizenReport.report}
                  </pre>
                </div>

                {selectedCitizenReport.notifications && selectedCitizenReport.notifications.length > 0 && (
                  <div className="space-y-2 pt-2 border-t border-white/10">
                    <span className="text-xs font-semibold text-slate-300">Emergency Responders Dispatched:</span>
                    <ul className="text-xs space-y-1 text-slate-400">
                      {selectedCitizenReport.notifications.map(n => (
                        <li key={n.id} className="flex items-center gap-2">
                          <span>🚨</span> <strong>{n.department}:</strong> {n.message}
                        </li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-white/5 py-6 px-4 text-center text-xs text-slate-500">
            <p>Department of Allied Computer Science & Engineering — Batch CSM-03</p>
            <p className="mt-1">Hybrid AI-Based Traffic Incident Detection and Emergency Response System (NH16 Highway Corridor, Andhra Pradesh)</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

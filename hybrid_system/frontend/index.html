<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hybrid AI Traffic Incident Detection & Emergency Response</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Tailwind (CDN, no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + ReactDOM (CDN, no build step) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- Babel standalone lets us write JSX directly in the browser, so this page
     needs no npm install / webpack build -- just open it in a browser (or
     serve it, see README) once the FastAPI backend is running. -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API_BASE = (window.location.origin && window.location.origin.startsWith("http"))
  ? window.location.origin
  : "http://127.0.0.1:8000";

const SEVERITY_STYLES = {
  Normal:   "bg-green-100 text-green-800 border-green-300",
  Minor:    "bg-yellow-100 text-yellow-800 border-yellow-300",
  Moderate: "bg-orange-100 text-orange-800 border-orange-300",
  Major:    "bg-red-100 text-red-800 border-red-300",
};

function Badge({ label }) {
  const cls = SEVERITY_STYLES[label] || "bg-slate-100 text-slate-800 border-slate-300";
  return <span className={`px-2 py-1 rounded-full text-xs font-semibold border ${cls}`}>{label}</span>;
}

function KpiCard({ title, value, accent }) {
  return (
    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex-1 min-w-[140px]">
      <div className="text-sm text-slate-500">{title}</div>
      <div className={`text-3xl font-bold mt-1 ${accent || "text-slate-800"}`}>{value}</div>
    </div>
  );
}

function App() {
  const [stats, setStats] = useState({ total_incidents: 0, by_severity: {} });
  const [incidents, setIncidents] = useState([]);
  const [citizenReports, setCitizenReports] = useState([]);
  const [selected, setSelected] = useState(null);
  const [selectedCitizen, setSelectedCitizen] = useState(null);
  const [simStatus, setSimStatus] = useState({ running: false, processed: 0 });
  const [backendUp, setBackendUp] = useState(true);
  const [speed, setSpeed] = useState(1000);
  const [limit, setLimit] = useState(3000);

  const fetchAll = useCallback(async () => {
    try {
      const [s, i, st, cr] = await Promise.all([
        fetch(`${API_BASE}/api/stats`).then(r => r.json()),
        fetch(`${API_BASE}/api/incidents?limit=200`).then(r => r.json()),
        fetch(`${API_BASE}/api/simulation/status`).then(r => r.json()),
        fetch(`${API_BASE}/api/citizen/reports?limit=200`).then(r => r.json()),
      ]);
      setStats(s); setIncidents(i); setSimStatus(st); setCitizenReports(cr); setBackendUp(true);
    } catch (e) {
      setBackendUp(false);
    }
  }, []);

  useEffect(() => {
    fetchAll();
    const id = setInterval(fetchAll, 4000);
    return () => clearInterval(id);
  }, [fetchAll]);

  const startSim = async () => {
    await fetch(`${API_BASE}/api/simulation/start`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ speed: Number(speed), limit: Number(limit) || null }),
    });
    fetchAll();
  };
  const stopSim = async () => { await fetch(`${API_BASE}/api/simulation/stop`, { method: "POST" }); fetchAll(); };
  const clearIncidents = async () => { await fetch(`${API_BASE}/api/incidents`, { method: "DELETE" }); fetchAll(); };

  const viewReport = async (id) => {
    const detail = await fetch(`${API_BASE}/api/incidents/${id}`).then(r => r.json());
    setSelected(detail);
  };

  const viewCitizenReport = async (id) => {
    const detail = await fetch(`${API_BASE}/api/citizen/reports/${id}`).then(r => r.json());
    setSelectedCitizen(detail);
  };

  return (
    <div className="max-w-6xl mx-auto p-6">
      <header className="mb-6">
        <h1 className="text-2xl font-bold text-slate-900">🚦 Hybrid AI-Based Traffic Incident Detection & Emergency Response System — India</h1>
        <p className="text-slate-500 text-sm mt-1">
          Sensor analytics → XGBoost severity classification → AI report generation → automated emergency notification (Police 100 · Ambulance 108 · Fire 101)
        </p>
        <p className="text-slate-500 text-sm mt-1">
          Rural / camera-free areas can report an accident directly, with photo + GPS location, at{" "}
          <a className="text-blue-600 hover:underline" href="/app/report.html" target="_blank" rel="noreferrer">/app/report.html</a>.
        </p>
        {!backendUp && (
          <div className="mt-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3">
            Backend not reachable at {API_BASE}. Start it with <code>uvicorn main:app --port 8000</code> from the <code>backend/</code> folder.
          </div>
        )}
      </header>

      <section className="flex gap-4 flex-wrap mb-6">
        <KpiCard title="Total Incidents" value={stats.total_incidents ?? 0} />
        <KpiCard title="Minor" value={stats.by_severity?.Minor ?? 0} accent="text-yellow-600" />
        <KpiCard title="Moderate" value={stats.by_severity?.Moderate ?? 0} accent="text-orange-600" />
        <KpiCard title="Major" value={stats.by_severity?.Major ?? 0} accent="text-red-600" />
      </section>

      <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
        <h2 className="font-semibold mb-3">Dataset Replay Simulation</h2>
        <div className="flex flex-wrap items-end gap-4">
          <label className="text-sm">
            Speed (x real-time)
            <input type="number" className="block border rounded-md px-2 py-1 w-32 mt-1"
                   value={speed} onChange={e => setSpeed(e.target.value)} />
          </label>
          <label className="text-sm">
            Rows to replay
            <input type="number" className="block border rounded-md px-2 py-1 w-32 mt-1"
                   value={limit} onChange={e => setLimit(e.target.value)} />
          </label>
          <button onClick={startSim} className="bg-slate-900 text-white px-4 py-2 rounded-md text-sm hover:bg-slate-700">▶ Start</button>
          <button onClick={stopSim} className="bg-slate-200 text-slate-800 px-4 py-2 rounded-md text-sm hover:bg-slate-300">⏹ Stop</button>
          <button onClick={clearIncidents} className="bg-red-50 text-red-700 border border-red-200 px-4 py-2 rounded-md text-sm hover:bg-red-100">🗑 Clear incidents</button>
          <span className="text-sm text-slate-500 ml-auto">
            {simStatus.running ? "🟢 Running" : "🔴 Stopped"} — processed {simStatus.processed ?? 0} rows
          </span>
        </div>
      </section>

      <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <h2 className="font-semibold p-4 border-b border-slate-100">Incident Feed</h2>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-left">
              <tr>
                <th className="p-3">#</th>
                <th className="p-3">Detected At</th>
                <th className="p-3">Severity</th>
                <th className="p-3">Speed (km/h)</th>
                <th className="p-3">Occupancy</th>
                <th className="p-3">Location</th>
                <th className="p-3">Direction</th>
                <th className="p-3"></th>
              </tr>
            </thead>
            <tbody>
              {incidents.length === 0 && (
                <tr><td colSpan="8" className="p-6 text-center text-slate-400">
                  No incidents yet. Start the simulation above, or call POST /api/predict.
                </td></tr>
              )}
              {incidents.map(inc => (
                <tr key={inc.id} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="p-3">{inc.id}</td>
                  <td className="p-3">{new Date(inc.detected_at).toLocaleString()}</td>
                  <td className="p-3"><Badge label={inc.severity_label} /></td>
                  <td className="p-3">{inc.speed_kmph != null ? inc.speed_kmph.toFixed(1) : "—"}</td>
                  <td className="p-3">{inc.occupancy?.toFixed(3)}</td>
                  <td className="p-3">
                    {inc.location_name ? (
                      <div>
                        <div className="font-medium text-slate-800">{inc.location_name}</div>
                        <div className="text-xs text-slate-400">{[inc.road, inc.district, inc.state].filter(Boolean).join(", ")}</div>
                      </div>
                    ) : "—"}
                  </td>
                  <td className="p-3">{inc.direction}</td>
                  <td className="p-3">
                    <button onClick={() => viewReport(inc.id)} className="text-blue-600 hover:underline">View report</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mt-6">
        <h2 className="font-semibold p-4 border-b border-slate-100">
          📷 Citizen-Submitted Reports (photo + GPS, rural/roadside)
        </h2>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-left">
              <tr>
                <th className="p-3">Ref</th>
                <th className="p-3">Reported At</th>
                <th className="p-3">Photo</th>
                <th className="p-3">Severity</th>
                <th className="p-3">Location</th>
                <th className="p-3">Status</th>
                <th className="p-3"></th>
              </tr>
            </thead>
            <tbody>
              {citizenReports.length === 0 && (
                <tr><td colSpan="7" className="p-6 text-center text-slate-400">
                  No citizen reports yet. Share the public form at /app/report.html.
                </td></tr>
              )}
              {citizenReports.map(r => (
                <tr key={r.id} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="p-3 font-medium">CR-{r.id}</td>
                  <td className="p-3">{new Date(r.reported_at).toLocaleString()}</td>
                  <td className="p-3">
                    {r.image_path && (
                      <img src={`${API_BASE}${r.image_path}`} alt="accident" className="w-14 h-14 object-cover rounded-md border border-slate-200" />
                    )}
                  </td>
                  <td className="p-3"><Badge label={r.severity_label} /></td>
                  <td className="p-3">{r.display_address || [r.village || r.town, r.district, r.state].filter(Boolean).join(", ") || "—"}</td>
                  <td className="p-3">{r.status}</td>
                  <td className="p-3">
                    <button onClick={() => viewCitizenReport(r.id)} className="text-blue-600 hover:underline">View report</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      {selected && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4" onClick={() => setSelected(null)}>
          <div className="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-start mb-3">
              <h3 className="font-semibold text-lg">Incident #{selected.id} — AI Report</h3>
              <button onClick={() => setSelected(null)} className="text-slate-400 hover:text-slate-700">✕</button>
            </div>
            <pre className="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs whitespace-pre-wrap">{selected.report}</pre>
            <h4 className="font-semibold mt-4 mb-2 text-sm">Emergency Notifications Dispatched</h4>
            <ul className="text-sm space-y-1">
              {(selected.notifications || []).map(n => (
                <li key={n.id}>🚨 <span className="font-medium">{n.department}</span> — {new Date(n.sent_at).toLocaleString()}</li>
              ))}
            </ul>
          </div>
        </div>
      )}

      {selectedCitizen && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4" onClick={() => setSelectedCitizen(null)}>
          <div className="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-start mb-3">
              <h3 className="font-semibold text-lg">Citizen Report CR-{selectedCitizen.id}</h3>
              <button onClick={() => setSelectedCitizen(null)} className="text-slate-400 hover:text-slate-700">✕</button>
            </div>
            {selectedCitizen.image_path && (
              <img src={`${API_BASE}${selectedCitizen.image_path}`} alt="accident" className="w-full max-h-72 object-contain rounded-lg border border-slate-200 mb-3 bg-slate-50" />
            )}
            <pre className="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs whitespace-pre-wrap">{selectedCitizen.report}</pre>
            <h4 className="font-semibold mt-4 mb-2 text-sm">Responders Notified</h4>
            <ul className="text-sm space-y-1">
              {(selectedCitizen.notifications || []).map(n => (
                <li key={n.id}>🚨 <span className="font-medium">{n.department}</span> — {new Date(n.sent_at).toLocaleString()}</li>
              ))}
            </ul>
          </div>
        </div>
      )}

      <footer className="text-center text-xs text-slate-400 mt-8">
        Department of Allied Computer Science &amp; Engineering — Hybrid AI-Based Traffic Incident Detection and Emergency Response System (India)
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
